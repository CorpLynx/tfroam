[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tfroam"
dynamic = ["version"]
description = "Interactive Terraform configuration and plan visualizer (Python port of Rover)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tfroam", "terraform", "visualization", "graph", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# python-hcl2 supplies the HCL parse tree; tfroam reads that tree directly (for line numbers),
# so lark (its parser library) is declared explicitly and python-hcl2 is capped below the
# next major version.
dependencies = [
    "python-hcl2>=8.1.4,<9",
    "lark>=1.1.5,<2",
]

[project.optional-dependencies]
# Only -genImage needs a browser: also run `playwright install chromium`, or point
# ROVER_BROWSER_PATH at an existing Chrome/Chromium.
image = ["playwright>=1.40"]
# playwright is here so mypy can see its types; the image tests skip when no browser is available.
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "build>=1.0", "playwright>=1.40"]

# `rover` is the original command (README, Docker entrypoint, existing scripts); `tfroam` is the same program.
[project.scripts]
rover = "tfroam.cli:main"
tfroam = "tfroam.cli:main"

[project.urls]
Upstream = "https://github.com/im2nguyen/rover"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["tfroam*"]

[tool.setuptools.package-data]
# The prebuilt Vue frontend: end users never need Node.
"tfroam.ui" = ["dist/**/*"]
tfroam = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "tfroam.VERSION" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
