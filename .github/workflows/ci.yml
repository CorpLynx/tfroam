name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# A newer push to the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Third-party actions are pinned to full commit SHAs (version in the trailing comment); Dependabot bumps them.
jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Terraform (enables the real-Terraform test)
        if: runner.os != 'Windows'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Point the tests at Terraform
        if: runner.os != 'Windows'
        shell: bash
        run: echo "TERRAFORM_BIN=$(which terraform)" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy --strict tfroam tests
      - name: Tests
        run: pytest -q
  image:
    name: Image mode (real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,image]"
      - run: playwright install --with-deps chromium
      - name: Screenshot tests (must not be skipped)
        run: pytest -q -rs tests/test_screenshot.py
  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install into a clean virtualenv and run
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/clean/bin/rover -version
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/simple-test" wd
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          text = (root / "tests/golden/simple-test/plan.js").read_text()
          pathlib.Path("plan.json").write_text(json.dumps(json.loads(text[text.index("=") + 1:])))
          PY
          /tmp/clean/bin/rover -workingDir wd -planJSONPath plan.json -standalone true
          python -c "import zipfile; assert 'index.html' in zipfile.ZipFile('rover.zip').namelist()"
  opentofu:
    # Smoke test only: proves `-tfPath tofu` drives init/plan/show end to end. The goldens are Terraform's.
    name: OpenTofu smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - run: python -m pip install .
      - name: Standalone zip with OpenTofu
        # simple-test has a single output and no providers, so `tofu init` downloads nothing.
        run: |
          cd "$(mktemp -d)"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/simple-test" wd
          rover -tfPath tofu -workingDir wd -standalone true
          python -c "import zipfile; assert 'index.html' in zipfile.ZipFile('rover.zip').namelist()"
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build . -t im2nguyen/rover
      - name: Version
        run: docker run --rm im2nguyen/rover -version
      - name: Terraform is where the original image has it
        run: docker run --rm --entrypoint /bin/terraform im2nguyen/rover version
      - name: Standalone from a plan file, using the README command shape
        run: |
          mkdir work && cp -r tests/fixtures/simple-test/. work/
          python3 - <<'PY'
          import json, pathlib
          text = pathlib.Path("tests/golden/simple-test/plan.js").read_text()
          pathlib.Path("work/plan.json").write_text(json.dumps(json.loads(text[text.index("=") + 1:])))
          PY
          docker run --rm -v "$PWD/work:/src" im2nguyen/rover -planJSONPath=plan.json -standalone true
          test -s work/rover.zip
      - name: Server is reachable through the port mapping (entrypoint binds 0.0.0.0)
        run: |
          docker run -d --name rover-server -p 9000:9000 -v "$PWD/work:/src" im2nguyen/rover -planJSONPath=plan.json
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/health; then ready=1; break; fi
            sleep 2
          done
          if [ -z "${ready:-}" ]; then
            echo "Rover did not answer /health within 60 s" >&2
            docker logs rover-server
            exit 1
          fi
          curl -fsS http://127.0.0.1:9000/api/graph -o graph.json
          python3 -c "import json; d = json.load(open('graph.json')); assert isinstance(d['nodes'], list), d"
      - name: Stop the server container
        if: always()
        run: docker rm -f rover-server || true
      - name: Image mode inside the container
        run: |
          docker run --rm -v "$PWD/work:/src" im2nguyen/rover -planJSONPath=plan.json -genImage true
          test -s work/rover.svg
